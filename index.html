<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>RayStrike — 3D Raycaster FPS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body, #game, #view {
  touch-action: none;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070c;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #eaf6ff;
}

#game { position: relative; width: 100vw; height: 100vh; }
#view { display: block; width: 100%; height: 100%; cursor: crosshair; }

#hud {
  position: absolute; left: 24px; bottom: 24px;
  display: flex; gap: 14px; z-index: 10; pointer-events: none;
}

.panel {
  min-width: 125px; padding: 10px 16px;
  border: 1px solid rgba(0,229,255,.35); border-radius: 10px;
  background: rgba(4,10,18,.72); backdrop-filter: blur(6px); text-align: center;
}

.panel span {
  display: block; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #79d8ff;
}

.panel strong { font-size: 24px; }

#minimap {
  position: absolute; top: 24px; right: 24px; width: 210px; height: 210px;
  border: 1px solid rgba(0,229,255,.45); border-radius: 10px;
  background: rgba(3,8,14,.75); box-shadow: 0 0 25px rgba(0,229,255,.12); z-index: 10;
}

#overlay, #gameOver {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 16px;
  text-align: center; background: rgba(2,5,10,.88); z-index: 20;
}

#overlay h1, #gameOver h1 {
  font-size: clamp(40px, 8vw, 82px); letter-spacing: 7px; color: #00e5ff;
  text-shadow: 0 0 22px rgba(0,229,255,.65);
}

#overlay p, #gameOver p { color: #b9d6e6; font-size: 15px; line-height: 1.6; }

button {
  margin: 0 auto; padding: 13px 32px; border: 0; border-radius: 8px;
  font: 700 15px/1 "Segoe UI", Arial, sans-serif; letter-spacing: 2px;
  text-transform: uppercase; color: #04121a; background: #00e5ff; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

button:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(0,229,255,.55); }

#overlay.hidden,
#gameOver.hidden {
  display: none !important;
}

#damage {
  position: absolute; inset: 0;
  background: radial-gradient(circle, transparent 45%, rgba(255,25,65,.55));
  opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 15;
}

#touchControls {
  position: absolute; inset: 0; z-index: 12;
  display: none; pointer-events: none;
}

#joystick {
  position: absolute; left: 28px; bottom: 110px; width: 150px; height: 150px;
  border: 2px solid rgba(0,229,255,.45); border-radius: 50%;
  background: rgba(4,12,20,.45); pointer-events: auto; touch-action: none;
}

#joystickKnob {
  position: absolute; top: 50%; left: 50%; width: 62px; height: 62px;
  border-radius: 50%; transform: translate(-50%, -50%);
  background: rgba(0,229,255,.75); box-shadow: 0 0 18px rgba(0,229,255,.55);
}

#fireButton {
  position: absolute; right: 32px; bottom: 130px; width: 105px; height: 105px;
  border-radius: 50%; border: 2px solid rgba(255,47,94,.7);
  background: rgba(255,47,94,.22); color: #fff;
  font: 800 16px/1 "Segoe UI", Arial, sans-serif; letter-spacing: 2px;
  pointer-events: auto; touch-action: manipulation; user-select: none;
}

#fireButton:active { background: rgba(255,47,94,.5); }

@media (hover: none) and (pointer: coarse) {
  #touchControls { display: block; }
  #hud { bottom: 20px; left: 20px; transform: scale(.82); transform-origin: bottom left; }
  #minimap { width: 150px; height: 150px; top: 16px; right: 16px; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <canvas id="minimap" width="420" height="420"></canvas>
  <div id="damage"></div>

  <div id="hud">
    <div class="panel"><span>Score</span><strong id="score">0</strong></div>
    <div class="panel"><span>Health</span><strong id="health">100</strong></div>
    <div class="panel"><span>Ammo</span><strong id="ammo">24</strong></div>
  </div>

  <div id="touchControls">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <button id="fireButton">FIRE</button>
  </div>

  <div id="overlay">
    <h1>RAYSTRIKE</h1>
    <p>
      <b>W A S D</b> — move<br />
      Mouse — look<br />
      <b>Right-click</b> — shoot<br />
      <b>Shift</b> — sprint<br />
      Touch: joystick moves, right side looks, FIRE shoots
    </p>
    <button id="start">Start Mission</button>
  </div>

  <div id="gameOver" class="hidden">
    <h1>MISSION FAILED</h1>
    <p>Enemies eliminated: <span id="finalScore">0</span></p>
    <button id="restart">Try Again</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const view = document.getElementById("view");
  const viewCtx = view.getContext("2d", { alpha: false });
  const minimap = document.getElementById("minimap");
  const mini = minimap.getContext("2d");

  const scoreEl = document.getElementById("score");
  const healthEl = document.getElementById("health");
  const ammoEl = document.getElementById("ammo");
  const overlay = document.getElementById("overlay");
  const gameOver = document.getElementById("gameOver");
  const finalScore = document.getElementById("finalScore");
  const damageFlash = document.getElementById("damage");

  const joystick = document.getElementById("joystick");
  const joystickKnob = document.getElementById("joystickKnob");
  const fireButton = document.getElementById("fireButton");

  const MAP = [
    "1111111111111111",
    "1000000000000001",
    "1011110111101101",
    "1010000100001001",
    "1010111101101101",
    "1000100000001001",
    "1110101111101111",
    "1000100000000001",
    "1011110111110101",
    "1000000100000101",
    "1111100101111101",
    "1000000100000001",
    "1011111111111101",
    "1000000000000001",
    "1011110111111101",
    "1111111111111111"
  ];

  const MAP_W = MAP[0].length;
  const MAP_H = MAP.length;
  const FOV = Math.PI / 3;
  const TEX_SIZE = 64;
  const RENDER_W = 420;
  const MAX_ENEMIES = 10;

  const buffer = document.createElement("canvas");
  buffer.width = RENDER_W;
  const bctx = buffer.getContext("2d", { alpha: false });

  const minimapCache = document.createElement("canvas");
  minimapCache.width = minimap.width;
  minimapCache.height = minimap.height;
  const miniCacheCtx = minimapCache.getContext("2d");

  let RENDER_H = 240;
  let W = 0, H = 0;
  let running = false;
  let animationFrameId = null;
  let score = 0, health = 100, ammo = 24;
  let lastFrameTime = 0;
  let damageFlashUntil = 0;

  let ceilingGradient = null;
  let floorGradient = null;

  const player = { x: 1.5, y: 1.5, angle: 0, speed: 5.6, sprint: 1.8, radius: .22 };
  const keys = { w: false, a: false, s: false, d: false, shift: false };
  const enemies = [];
  const sortedEnemies = [];
  const zBuffer = new Float32Array(RENDER_W);

  const touchMove = { active: false, id: null, centerX: 0, centerY: 0, x: 0, y: 0 };
  const touchLook = { active: false, id: null, lastX: 0 };

  const textures = [];
  const enemySprite = document.createElement("canvas");
  enemySprite.width = 64;
  enemySprite.height = 64;

  const rayResult = {
    distance: 0,
    wallX: 0,
    texture: null,
    side: 0
  };

  let displayedScore = -1;
  let displayedHealth = -1;
  let displayedAmmo = -1;

  function makeTexture(type) {
    const canvas = document.createElement("canvas");
    canvas.width = TEX_SIZE;
    canvas.height = TEX_SIZE;
    const c = canvas.getContext("2d");

    if (type === 1) {
      c.fillStyle = "#6b4b2c";
      c.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

      for (let y = 0; y < TEX_SIZE; y += 16) {
        for (let x = 0; x < TEX_SIZE; x += 32) {
          c.fillStyle = (y / 16) % 2 ? "#7d5935" : "#5c4025";
          c.fillRect(x + ((y / 16) % 2 ? 16 : 0), y, 30, 14);
        }
      }

      c.strokeStyle = "rgba(0,0,0,.35)";
      c.lineWidth = 2;

      for (let y = 0; y <= TEX_SIZE; y += 16) {
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(TEX_SIZE, y);
        c.stroke();
      }
    }

    if (type === 2) {
      const gradient = c.createLinearGradient(0, 0, TEX_SIZE, TEX_SIZE);
      gradient.addColorStop(0, "#2c3d55");
      gradient.addColorStop(1, "#16202e");
      c.fillStyle = gradient;
      c.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

      c.strokeStyle = "#4fd8ff";
      c.lineWidth = 2;
      c.shadowColor = "#4fd8ff";
      c.shadowBlur = 8;

      for (let i = 8; i < TEX_SIZE; i += 16) {
        c.beginPath();
        c.moveTo(i, 0);
        c.lineTo(i, TEX_SIZE);
        c.stroke();
      }

      c.shadowBlur = 0;
    }

    if (type === 3) {
      c.fillStyle = "#3b3f47";
      c.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

      for (let i = 0; i < 900; i++) {
        const shade = 45 + Math.random() * 55;
        c.fillStyle = `rgb(${shade},${shade + 5},${shade + 12})`;
        c.fillRect(Math.random() * TEX_SIZE, Math.random() * TEX_SIZE, 3, 3);
      }

      c.strokeStyle = "#22262d";
      c.lineWidth = 4;
      c.strokeRect(2, 2, TEX_SIZE - 4, TEX_SIZE - 4);
    }

    return canvas;
  }

  function makeEnemySprite() {
    const c = enemySprite.getContext("2d");
    c.fillStyle = "#ff2f5e";
    c.shadowColor = "#ff2f5e";
    c.shadowBlur = 12;
    c.beginPath(); c.arc(32, 26, 17, 0, Math.PI * 2); c.fill();
    c.fillRect(19, 40, 26, 20);
    c.fillStyle = "#0b0d12";
    c.beginPath(); c.arc(25, 24, 4, 0, Math.PI * 2); c.arc(39, 24, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#ffe066";
    c.fillRect(24, 44, 16, 4);
  }

  function createBackgroundGradients() {
    ceilingGradient = bctx.createLinearGradient(0, 0, 0, RENDER_H / 2);
    ceilingGradient.addColorStop(0, "#0a1522");
    ceilingGradient.addColorStop(1, "#182c42");

    floorGradient = bctx.createLinearGradient(0, RENDER_H / 2, 0, RENDER_H);
    floorGradient.addColorStop(0, "#101820");
    floorGradient.addColorStop(1, "#05080c");
  }

  function buildMinimapCache() {
    const size = minimapCache.width;
    const scale = size / Math.max(MAP_W, MAP_H);

    miniCacheCtx.clearRect(0, 0, size, size);
    miniCacheCtx.fillStyle = "rgba(3,8,14,.82)";
    miniCacheCtx.fillRect(0, 0, size, size);

    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const cell = Number(MAP[y][x]);

        miniCacheCtx.fillStyle = cell === 0
          ? "rgba(0,229,255,.07)"
          : cell === 1 ? "rgba(120,80,45,.85)"
          : cell === 2 ? "rgba(0,150,220,.85)"
          : "rgba(90,100,115,.85)";

        miniCacheCtx.fillRect(x * scale, y * scale, scale - 1, scale - 1);
      }
    }
  }

  function resize() {
    W = view.width = Math.max(320, Math.floor(window.innerWidth));
    H = view.height = Math.max(240, Math.floor(window.innerHeight));

    RENDER_H = Math.max(180, Math.round(RENDER_W * H / W));
    buffer.width = RENDER_W;
    buffer.height = RENDER_H;

    viewCtx.imageSmoothingEnabled = false;
    createBackgroundGradients();
  }

  function isWall(x, y) {
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return true;
    return MAP[Math.floor(y)][Math.floor(x)] !== "0";
  }

  function canMove(x, y) {
    const r = player.radius;

    return !isWall(x - r, y - r) && !isWall(x + r, y - r) &&
           !isWall(x - r, y + r) && !isWall(x + r, y + r);
  }

  function updateHUD() {
    if (score !== displayedScore) {
      scoreEl.textContent = score;
      displayedScore = score;
    }

    if (health !== displayedHealth) {
      healthEl.textContent = health;
      displayedHealth = health;
    }

    if (ammo !== displayedAmmo) {
      ammoEl.textContent = ammo;
      displayedAmmo = ammo;
    }
  }

  function spawnEnemy() {
    for (let attempts = 0; attempts < 120; attempts++) {
      const x = 1.5 + Math.random() * (MAP_W - 3);
      const y = 1.5 + Math.random() * (MAP_H - 3);
      const dx = x - player.x;
      const dy = y - player.y;

      if (!isWall(x, y) && dx * dx + dy * dy >= 16) {
        enemies.push({
          x, y,
          health: 2,
          speed: .75 + Math.random() * .65,
          distanceSquared: 0
        });

        return true;
      }
    }

    return false;
  }

  function startGame() {
    score = 0;
    health = 100;
    ammo = 24;
    enemies.length = 0;

    displayedScore = -1;
    displayedHealth = -1;
    displayedAmmo = -1;

    player.x = 1.5;
    player.y = 1.5;
    player.angle = 0;

    for (let i = 0; i < 7; i++) spawnEnemy();

    updateHUD();
    overlay.classList.add("hidden");
    gameOver.classList.add("hidden");

    running = true;
    lastFrameTime = performance.now();

    if (animationFrameId === null) {
      animationFrameId = requestAnimationFrame(loop);
    }

    if (view.requestPointerLock) {
      const result = view.requestPointerLock();
      if (result && result.catch) result.catch(() => {});
    }
  }

  function stopGame(showStartScreen) {
    running = false;

    if (animationFrameId !== null) {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
    }

    for (const key in keys) keys[key] = false;

    touchMove.active = false;
    touchMove.id = null;
    touchLook.active = false;
    touchLook.id = null;
    joystickKnob.style.transform = "translate(-50%, -50%)";

    damageFlash.style.opacity = "0";
    damageFlashUntil = 0;

    if (showStartScreen) {
      overlay.classList.remove("hidden");
      gameOver.classList.add("hidden");
    }

    if (document.exitPointerLock) document.exitPointerLock();
  }

  function endGame() {
    finalScore.textContent = score;
    gameOver.classList.remove("hidden");
    stopGame(false);
  }

  function castRay(cameraX, dirX, dirY, planeX, planeY) {
    const rayX = dirX + planeX * cameraX;
    const rayY = dirY + planeY * cameraX;

    let mapX = Math.floor(player.x);
    let mapY = Math.floor(player.y);

    const deltaDistX = Math.abs(rayX) < 1e-8 ? 1e30 : Math.abs(1 / rayX);
    const deltaDistY = Math.abs(rayY) < 1e-8 ? 1e30 : Math.abs(1 / rayY);

    let stepX, stepY, sideDistX, sideDistY;

    if (rayX < 0) {
      stepX = -1;
      sideDistX = (player.x - mapX) * deltaDistX;
    } else {
      stepX = 1;
      sideDistX = (mapX + 1 - player.x) * deltaDistX;
    }

    if (rayY < 0) {
      stepY = -1;
      sideDistY = (player.y - mapY) * deltaDistY;
    } else {
      stepY = 1;
      sideDistY = (mapY + 1 - player.y) * deltaDistY;
    }

    let side = 0;
    let wallType = 1;
    let hit = false;

    while (!hit) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }

      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) break;

      const cell = Number(MAP[mapY][mapX]);
      if (cell > 0) {
        wallType = cell;
        hit = true;
      }
    }

    const perpDist = Math.max(.05, side === 0
      ? sideDistX - deltaDistX
      : sideDistY - deltaDistY);

    let wallX = side === 0
      ? player.y + perpDist * rayY
      : player.x + perpDist * rayX;

    wallX -= Math.floor(wallX);

    rayResult.distance = perpDist;
    rayResult.wallX = wallX;
    rayResult.texture = textures[wallType - 1];
    rayResult.side = side;

    return rayResult;
  }

  function getWallDistance(dirX, dirY) {
    let mapX = Math.floor(player.x);
    let mapY = Math.floor(player.y);

    const deltaDistX = Math.abs(dirX) < 1e-8 ? 1e30 : Math.abs(1 / dirX);
    const deltaDistY = Math.abs(dirY) < 1e-8 ? 1e30 : Math.abs(1 / dirY);

    const stepX = dirX < 0 ? -1 : 1;
    const stepY = dirY < 0 ? -1 : 1;

    let sideDistX = dirX < 0
      ? (player.x - mapX) * deltaDistX
      : (mapX + 1 - player.x) * deltaDistX;

    let sideDistY = dirY < 0
      ? (player.y - mapY) * deltaDistY
      : (mapY + 1 - player.y) * deltaDistY;

    for (let steps = 0; steps < 64; steps++) {
      let side;

      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }

      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) {
        return Infinity;
      }

      if (MAP[mapY][mapX] !== "0") {
        return side === 0
          ? sideDistX - deltaDistX
          : sideDistY - deltaDistY;
      }
    }

    return Infinity;
  }

  function shoot() {
    if (!running || ammo <= 0) return;

    ammo--;
    updateHUD();

    const dirX = Math.cos(player.angle);
    const dirY = Math.sin(player.angle);
    const wallDistance = getWallDistance(dirX, dirY);

    let target = null;
    let bestDistance = Infinity;

    for (const enemy of enemies) {
      const dx = enemy.x - player.x;
      const dy = enemy.y - player.y;

      const along = dx * dirX + dy * dirY;

      if (along <= 0 || along >= wallDistance) continue;

      const perpendicular = Math.abs(dx * dirY - dy * dirX);

      if (perpendicular < .45 && along < bestDistance) {
        target = enemy;
        bestDistance = along;
      }
    }

    if (target) {
      target.health--;

      if (target.health <= 0) {
        enemies.splice(enemies.indexOf(target), 1);
        score++;
        ammo = Math.min(24, ammo + 2);
        updateHUD();

        if (enemies.length < MAX_ENEMIES) spawnEnemy();
      }
    }
  }

  function update(dt) {
    if (!running) return;

    let forward = 0;
    let strafe = 0;

    if (keys.w) forward += 1;
    if (keys.s) forward -= 1;
    if (keys.a) strafe -= 1;
    if (keys.d) strafe += 1;

    if (touchMove.active) {
      const dx = touchMove.x - touchMove.centerX;
      const dy = touchMove.y - touchMove.centerY;
      const strength = Math.min(1, Math.hypot(dx, dy) / 55);

      if (strength > .1) {
        const angle = Math.atan2(dy, dx);
        forward += -Math.sin(angle) * strength;
        strafe += Math.cos(angle) * strength;
      }
    }

    if (forward !== 0 || strafe !== 0) {
      const length = Math.hypot(forward, strafe);
      forward /= length;
      strafe /= length;

      const speed = player.speed * (keys.shift ? player.sprint : 1);
      const cos = Math.cos(player.angle);
      const sin = Math.sin(player.angle);

      const moveX = (cos * forward - sin * strafe) * speed * dt;
      const moveY = (sin * forward + cos * strafe) * speed * dt;

      if (canMove(player.x + moveX, player.y)) player.x += moveX;
      if (canMove(player.x, player.y + moveY)) player.y += moveY;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const distanceSquared = dx * dx + dy * dy;
      const distance = Math.sqrt(distanceSquared) || 1;

      const nx = enemy.x + (dx / distance) * enemy.speed * dt;
      const ny = enemy.y + (dy / distance) * enemy.speed * dt;

      if (!isWall(nx, enemy.y)) enemy.x = nx;
      if (!isWall(enemy.x, ny)) enemy.y = ny;

      const postDx = player.x - enemy.x;
      const postDy = player.y - enemy.y;
      const postDistanceSquared = postDx * postDx + postDy * postDy;

      if (postDistanceSquared < .49) {
        health -= 12;
        updateHUD();

        damageFlashUntil = performance.now() + 140;
        damageFlash.style.opacity = ".9";

        enemies.splice(i, 1);

        if (health <= 0) {
          endGame();
          return;
        }
      }
    }

    if (damageFlashUntil && performance.now() >= damageFlashUntil) {
      damageFlash.style.opacity = "0";
      damageFlashUntil = 0;
    }
  }

  function renderWalls() {
    bctx.fillStyle = ceilingGradient;
    bctx.fillRect(0, 0, RENDER_W, RENDER_H / 2);

    bctx.fillStyle = floorGradient;
    bctx.fillRect(0, RENDER_H / 2, RENDER_W, RENDER_H / 2);

    const dirX = Math.cos(player.angle);
    const dirY = Math.sin(player.angle);
    const planeLength = Math.tan(FOV / 2);
    const planeX = -dirY * planeLength;
    const planeY = dirX * planeLength;

    for (let x = 0; x < RENDER_W; x++) {
      const cameraX = 2 * x / RENDER_W - 1;
      const ray = castRay(cameraX, dirX, dirY, planeX, planeY);

      const rayDistance = ray.distance;
      const rayWallX = ray.wallX;
      const rayTexture = ray.texture;
      const raySide = ray.side;

      zBuffer[x] = rayDistance;

      const lineHeight = RENDER_H / rayDistance;
      const drawStart = Math.max(0, (RENDER_H - lineHeight) / 2);
      const drawEnd = Math.min(RENDER_H, (RENDER_H + lineHeight) / 2);
      const textureX = Math.min(TEX_SIZE - 1, Math.floor(rayWallX * TEX_SIZE));

      bctx.drawImage(
        rayTexture,
        textureX, 0, 1, TEX_SIZE,
        x, drawStart, 1, drawEnd - drawStart
      );

      const shade = Math.min(.68, rayDistance / 18);
      const sideShade = raySide === 1 ? .15 : 0;

      bctx.fillStyle = `rgba(2,6,12,${shade + sideShade})`;
      bctx.fillRect(x, drawStart, 1, drawEnd - drawStart);
    }
  }

  function renderEnemies() {
    sortedEnemies.length = 0;

    for (const enemy of enemies) {
      const dx = enemy.x - player.x;
      const dy = enemy.y - player.y;
      enemy.distanceSquared = dx * dx + dy * dy;
      sortedEnemies.push(enemy);
    }

    sortedEnemies.sort((a, b) => b.distanceSquared - a.distanceSquared);

    const dirX = Math.cos(player.angle);
    const dirY = Math.sin(player.angle);
    const planeLength = Math.tan(FOV / 2);
    const planeX = -dirY * planeLength;
    const planeY = dirX * planeLength;
    const invDet = 1 / (planeX * dirY - dirX * planeY);

    for (const enemy of sortedEnemies) {
      const dx = enemy.x - player.x;
      const dy = enemy.y - player.y;

      const transformX = invDet * (dirY * dx - dirX * dy);
      const transformY = invDet * (-planeY * dx + planeX * dy);

      if (transformY <= .2) continue;

      const screenX = Math.floor((RENDER_W / 2) * (1 + transformX / transformY));
      const spriteHeight = Math.abs(RENDER_H / transformY) * .8;
      const spriteWidth = spriteHeight;

      const drawStartY = -spriteHeight / 2 + RENDER_H / 2;
      const drawEndY = spriteHeight / 2 + RENDER_H / 2;
      const drawStartX = -spriteWidth / 2 + screenX;
      const drawEndX = spriteWidth / 2 + screenX;

      for (let x = Math.max(0, Math.floor(drawStartX)); x < Math.min(RENDER_W, drawEndX); x++) {
        if (transformY >= zBuffer[x]) continue;

        const texX = Math.min(
          TEX_SIZE - 1,
          Math.max(0, Math.floor(((x - drawStartX) * TEX_SIZE) / spriteWidth))
        );

        bctx.drawImage(
          enemySprite,
          texX, 0, 1, TEX_SIZE,
          x, drawStartY, 1, drawEndY - drawStartY
        );
      }
    }
  }

  function renderWeapon() {
    const bob = Math.sin(performance.now() / 130) * 4;
    const baseX = RENDER_W / 2;
    const baseY = RENDER_H + bob;

    bctx.fillStyle = "#171d26";
    bctx.beginPath();
    bctx.moveTo(baseX - 24, baseY);
    bctx.lineTo(baseX - 13, baseY - 95);
    bctx.lineTo(baseX + 13, baseY - 95);
    bctx.lineTo(baseX + 24, baseY);
    bctx.closePath();
    bctx.fill();

    bctx.fillStyle = "#00e5ff";
    bctx.fillRect(baseX - 5, baseY - 108, 10, 17);
  }

  function renderMinimap() {
    mini.clearRect(0, 0, minimap.width, minimap.height);
    mini.drawImage(minimapCache, 0, 0);

    const scale = minimap.width / Math.max(MAP_W, MAP_H);

    mini.fillStyle = "#ff2f5e";

    for (const enemy of enemies) {
      mini.beginPath();
      mini.arc(enemy.x * scale, enemy.y * scale, 5, 0, Math.PI * 2);
      mini.fill();
    }

    mini.strokeStyle = "#00e5ff";
    mini.lineWidth = 2;
    mini.beginPath();
    mini.moveTo(player.x * scale, player.y * scale);
    mini.lineTo(
      (player.x + Math.cos(player.angle) * 2) * scale,
      (player.y + Math.sin(player.angle) * 2) * scale
    );
    mini.stroke();

    mini.fillStyle = "#00e5ff";
    mini.beginPath();
    mini.arc(player.x * scale, player.y * scale, 6, 0, Math.PI * 2);
    mini.fill();
  }

  function render() {
    renderWalls();
    renderEnemies();
    renderWeapon();
    renderMinimap();

    viewCtx.imageSmoothingEnabled = false;
    viewCtx.drawImage(buffer, 0, 0, W, H);
  }

  function loop(timestamp) {
    if (!running) {
      animationFrameId = null;
      return;
    }

    const dt = Math.min(.1, Math.max(0, (timestamp - lastFrameTime) / 1000));
    lastFrameTime = timestamp;

    update(dt);
    render();

    animationFrameId = requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);

  window.addEventListener("keydown", event => {
    const key = event.code.replace("Key", "").toLowerCase();

    if (key in keys) keys[key] = true;

    if (event.code === "ShiftLeft" || event.code === "ShiftRight") {
      keys.shift = true;
    }

    if (event.code === "Space") event.preventDefault();
  });

  window.addEventListener("keyup", event => {
    const key = event.code.replace("Key", "").toLowerCase();

    if (key in keys) keys[key] = false;

    if (event.code === "ShiftLeft" || event.code === "ShiftRight") {
      keys.shift = false;
    }
  });

  window.addEventListener("blur", () => {
    for (const key in keys) keys[key] = false;

    if (running) stopGame(true);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) stopGame(true);
  });

  view.addEventListener("mousemove", event => {
    if (document.pointerLockElement !== view) return;
    player.angle += event.movementX * .0028;
  });

  view.addEventListener("mousedown", event => {
    if (event.button === 2) {
      event.preventDefault();
      shoot();
    }
  });

  view.addEventListener("contextmenu", event => event.preventDefault());

  document.addEventListener("pointerlockchange", () => {
    if (!document.pointerLockElement && running) {
      stopGame(true);
    }
  });

  function isTouchDevice() {
    return "ontouchstart" in window || navigator.maxTouchPoints > 0;
  }

  function handleJoystickStart(event) {
    for (const touch of event.changedTouches) {
      if (touchMove.active) continue;

      const rect = joystick.getBoundingClientRect();

      touchMove.active = true;
      touchMove.id = touch.identifier;
      touchMove.centerX = rect.left + rect.width / 2;
      touchMove.centerY = rect.top + rect.height / 2;
      touchMove.x = touch.clientX;
      touchMove.y = touch.clientY;
    }

    event.preventDefault();
  }

  function handleJoystickMove(event) {
    for (const touch of event.changedTouches) {
      if (!touchMove.active || touch.identifier !== touchMove.id) continue;

      touchMove.x = touch.clientX;
      touchMove.y = touch.clientY;

      const dx = touchMove.x - touchMove.centerX;
      const dy = touchMove.y - touchMove.centerY;
      const distance = Math.hypot(dx, dy);
      const max = 55;

      if (distance > max) {
        touchMove.x = touchMove.centerX + (dx / distance) * max;
        touchMove.y = touchMove.centerY + (dy / distance) * max;
      }

      joystickKnob.style.transform = `translate(calc(-50% + ${touchMove.x - touchMove.centerX}px), calc(-50% + ${touchMove.y - touchMove.centerY}px))`;
    }

    event.preventDefault();
  }

  function handleJoystickEnd(event) {
    for (const touch of event.changedTouches) {
      if (touch.identifier !== touchMove.id) continue;

      touchMove.active = false;
      touchMove.id = null;
      joystickKnob.style.transform = "translate(-50%, -50%)";
    }

    event.preventDefault();
  }

  function handleLookStart(event) {
    for (const touch of event.changedTouches) {
      if (touchLook.active) continue;

      touchLook.active = true;
      touchLook.id = touch.identifier;
      touchLook.lastX = touch.clientX;
    }

    event.preventDefault();
  }

  function handleLookMove(event) {
    for (const touch of event.changedTouches) {
      if (!touchLook.active || touch.identifier !== touchLook.id) continue;

      player.angle += (touch.clientX - touchLook.lastX) * .006;
      touchLook.lastX = touch.clientX;
    }

    event.preventDefault();
  }

  function handleLookEnd(event) {
    for (const touch of event.changedTouches) {
      if (touch.identifier !== touchLook.id) continue;

      touchLook.active = false;
      touchLook.id = null;
    }

    event.preventDefault();
  }

  if (isTouchDevice()) {
    joystick.addEventListener("touchstart", handleJoystickStart, { passive: false });
    joystick.addEventListener("touchmove", handleJoystickMove, { passive: false });
    joystick.addEventListener("touchend", handleJoystickEnd, { passive: false });
    joystick.addEventListener("touchcancel", handleJoystickEnd, { passive: false });

    view.addEventListener("touchstart", handleLookStart, { passive: false });
    view.addEventListener("touchmove", handleLookMove, { passive: false });
    view.addEventListener("touchend", handleLookEnd, { passive: false });
    view.addEventListener("touchcancel", handleLookEnd, { passive: false });

    fireButton.addEventListener("touchstart", event => {
      event.preventDefault();
      shoot();
    }, { passive: false });
  }

  document.getElementById("start").addEventListener("click", startGame);
  document.getElementById("restart").addEventListener("click", startGame);

  textures.push(makeTexture(1), makeTexture(2), makeTexture(3));
  makeEnemySprite();

  resize();
  buildMinimapCache();
})();
</script>
</body>
</html>
